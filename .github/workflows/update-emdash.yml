name: Update EmDash

on:
  schedule:
    - cron: '0 0 1 * *' # First day of every month at 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-emdash
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update EmDash packages to the latest stable versions
        run: pnpm update --latest emdash '@emdash-cms/*'

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check types
        if: steps.changes.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: pnpm build

      - name: Create or update the dependency pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-emdash
          delete-branch: false
          add-paths: |
            package.json
            pnpm-lock.yaml
          commit-message: Update EmDash packages to the latest stable versions
          title: Update EmDash packages to the latest stable versions
          body: |
            EmDashと関連パッケージを最新安定版に更新します。メジャーバージョンの更新も対象です。

            型チェック・テスト・ビルドは、このPRを作成・更新する前に実行済みです。
            検証結果は[更新ワークフローの実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})で確認できます。

            mainへマージすると、既存のデプロイワークフローで反映されます。
